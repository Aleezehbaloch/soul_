<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15110e">
  <meta name="description" content="Explore the curated Soul collection and Little Looks, made with love.">
  <title>Shop All — Soul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <script src="header.js"></script>
  <main class="shop-all-page">
    <section class="container shop-all-collection-section" aria-labelledby="shop-all-heading">
      <div class="section-heading section-heading-row shop-all-section-heading">
        <div>
          <span class="eyebrow">Handpicked for you</span>
          <h1 id="shop-all-heading">THE CURATED EDIT</h1>
          <p>Exceptional details, chosen for your most meaningful moments.</p>
        </div>
      </div>
      <div class="collection-carousel shop-all-carousel">
        <button class="collection-carousel-arrow collection-carousel-prev" type="button" aria-label="Previous shop styles"><i class="bi bi-chevron-left"></i></button>
        <div class="collection-rail shop-all-products" id="shop-all-products" aria-label="All shop styles"></div>
        <div class="collection-carousel-progress" aria-hidden="true"><span></span></div>
        <button class="collection-carousel-arrow collection-carousel-next" type="button" aria-label="Next shop styles"><i class="bi bi-chevron-right"></i></button>
        <button class="collection-carousel-toggle" type="button" aria-label="Pause automatic movement of shop styles" aria-pressed="true"><i class="bi bi-pause-fill" aria-hidden="true"></i></button>
      </div>
    </section>
    <section class="container shop-all-kids-section" aria-labelledby="shop-all-kids-heading">
      <div class="shop-all-page-heading">
        <span class="eyebrow">The Kids Edit</span>
        <h2 id="shop-all-kids-heading">Little Looks, Made with Love</h2>
      </div>
      <div class="shop-all-products bridal-collection-grid" id="shop-all-kids-products" aria-label="Little Looks styles"></div>
    </section>
  </main>
  <script src="footer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
